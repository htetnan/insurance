services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: insurance_portal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    depends_on:
      - mysql
    environment:
      PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: insurance_portal
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: local-docker-only-change-in-production-very-long-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5000
      FILE_STORAGE_DIR: /data/uploads
    ports:
      - "8081:8081"
    volumes:
      - backend_uploads:/data/uploads

  analytics:
    build: ./salary_service
    environment:
      PORT: 8001
      SALARY_ALLOWED_ORIGINS: http://localhost:5000
    ports:
      - "8001:8001"

volumes:
  mysql_data:
  backend_uploads:
